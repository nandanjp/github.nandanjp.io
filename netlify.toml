[build]
command = "next build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
NEXT_PUBLIC_PERSONAL_API_URL = "https://personal-api.nandan-hl.dev"
NEXT_PUBLIC_NETLIFY = "true"

[images]
remote_images = [
    "https://avatars\\.githubusercontent\\.com/.*",
    "https://i\\.scdn\\.co/.*",
    "https://photos\\.nandan-hl\\.dev/.*"
]

[[headers]]
for = "/site.webmanifest"
  [headers.values]
  Content-Type = "application/manifest+json"

[dev]
command = "pnpm dev"
targetPort = 3000
port = 8888

[[plugins]]
package = "@netlify/plugin-lighthouse"

  [plugins.inputs.thresholds]
  performance    = 0.85
  accessibility  = 0.9
  best-practices = 0.9
  seo            = 0.9

  [[plugins.inputs.audits]]
  path = "/"

  [[plugins.inputs.audits]]
  path = "/blog"

  [[plugins.inputs.audits]]
  path = "/projects"

  [[plugins.inputs.audits]]
  path = "/photos"

  [[plugins.inputs.audits]]
  path = "/music"

  [[plugins.inputs.audits]]
  path = "/work"
